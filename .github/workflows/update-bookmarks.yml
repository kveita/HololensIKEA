name: Update Bookmarks

on:
  schedule:
    - cron: '0 0 * * 0'  # Every Sunday at midnight
  workflow_dispatch:  # Allow manual triggering

permissions:
  contents: write

jobs:
  update-bookmarks:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    - name: Install dependencies
      run: npm install

    - name: Install katana
      run: |
        curl -sL -o katana.zip https://github.com/projectdiscovery/katana/releases/download/v1.7.0/katana_1.7.0_linux_amd64.zip
        mkdir -p "$HOME/.local/bin-katana"
        unzip -o -q katana.zip -d "$HOME/.local/bin-katana"
        chmod +x "$HOME/.local/bin-katana/katana"
        echo "$HOME/.local/bin-katana" >> "$GITHUB_PATH"

    - name: Install Chromium runtime dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends \
          libnss3 libatk-bridge2.0-0 libatk1.0-0 libgtk-3-0 libgbm1 \
          libasound2t64 libx11-xcb1 libxcomposite1 libxdamage1 libxrandr2 libxkbcommon0

    - name: Generate bookmarks
      run: node scripts/discover-models.mjs
    
    - name: Commit and push changes
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        git add bookmarks.json
        git diff --cached --quiet || git commit -m "chore: update bookmarks.json with latest IKEA 3D models"
        git push
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
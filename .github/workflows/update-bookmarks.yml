name: Update Bookmarks

on:
  schedule:
    - cron: '0 0 * * 0'  # Every Sunday at midnight
  workflow_dispatch:  # Allow manual triggering

permissions:
  contents: write

jobs:
  update-bookmarks:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
    
    - name: Install dependencies
      run: npm install

    - name: Install katana
      run: |
        katana_url="$(curl -fsSL https://api.github.com/repos/projectdiscovery/katana/releases/latest | jq -r '.assets[] | select(.name | test("^katana_.*_linux_amd64\\.zip$")) | .browser_download_url' | head -n 1)"
        test -n "$katana_url"
        curl -fsSL -o katana.zip "$katana_url"
        mkdir -p "$HOME/.local/bin-katana"
        unzip -o -q katana.zip -d "$HOME/.local/bin-katana"
        chmod +x "$HOME/.local/bin-katana/katana"
        echo "$HOME/.local/bin-katana" >> "$GITHUB_PATH"

    - name: Install Chromium runtime dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends \
          libnss3 libatk-bridge2.0-0 libatk1.0-0 libgtk-3-0 libgbm1 \
          libasound2t64 libx11-xcb1 libxcomposite1 libxdamage1 libxrandr2 libxkbcommon0

    - name: Generate bookmarks
      run: node scripts/discover-models.mjs

    - name: Validate generated bookmarks
      run: |
        node --input-type=module <<'NODE'
        import fs from 'node:fs';
        const bookmarks = JSON.parse(fs.readFileSync('bookmarks.json', 'utf8'));
        if (!bookmarks.length) throw new Error('No model bookmarks were generated');
        for (const bookmark of bookmarks) {
          if (!bookmark.name || !/^https:\/\/www\.ikea\.com\//.test(bookmark.url)) {
            throw new Error(`Invalid IKEA bookmark: ${JSON.stringify(bookmark)}`);
          }
          if (bookmark.glbUrl || bookmark.sourceGlbUrl) {
            throw new Error(`GLB URLs must not be stored in bookmarks.json: ${bookmark.name}`);
          }
        }
        if (fs.existsSync('Models') && fs.readdirSync('Models').some(name => name.toLowerCase().endsWith('.glb'))) {
          throw new Error('Models/ must remain empty; GLBs are downloaded on the HoloLens.');
        }
        console.log(`Validated ${bookmarks.length} IKEA page bookmarks.`);
        NODE
    
    - name: Commit and push changes
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        git add bookmarks.json Models/
        git diff --cached --quiet || git commit -m "chore: update bookmarks.json with latest IKEA 3D models"
        git push
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
